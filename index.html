<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rent a Servant — Interactive Prototype</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--navy:#10233f;--blue:#2457d6;--warm:#f3a64a;--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#70798c;--line:#e7eaf0;--green:#20a46b;--red:#d84b55}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:#dfe4ec;color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{min-height:100vh;display:flex;justify-content:center;padding:28px}
.phone{width:390px;min-height:820px;background:var(--bg);border-radius:32px;overflow:hidden;box-shadow:0 25px 70px #14203933;position:relative}
.top{padding:18px 20px 12px;background:var(--card);display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;letter-spacing:.3px;color:var(--navy)}.logo span{color:var(--warm)}
.content{padding:20px 18px 96px}.title{font-size:27px;line-height:1.1;margin:8px 0}.sub{color:var(--muted);font-size:14px;line-height:1.5}
.search{background:white;border:1px solid var(--line);padding:14px 16px;border-radius:16px;margin:18px 0;display:flex;gap:10px;color:#8b93a3}
.section{font-weight:800;margin:22px 0 12px}.row{display:flex;gap:12px;overflow:auto;padding-bottom:4px}.row::-webkit-scrollbar{display:none}
.service{min-width:105px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}.ico{font-size:26px}.service small{display:block;margin-top:8px;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 5px 16px #17203308}
.worker{display:flex;gap:12px}.avatar{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#cdd8ee,#f3cda0);display:grid;place-items:center;font-weight:900;color:var(--navy)}
.badge{display:inline-flex;align-items:center;gap:5px;background:#e9f8f1;color:#14764e;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;margin-top:7px}.stars{color:#e69a26;font-weight:800}
.price{font-size:20px;font-weight:900;color:var(--navy)}.distance{color:var(--muted);font-size:12px}
.actions{display:flex;gap:9px;margin-top:14px}.btn{padding:12px 15px;border-radius:13px;font-weight:800;flex:1}.primary{background:var(--navy);color:#fff}.secondary{background:#eef2f8;color:var(--navy)}.warm{background:var(--warm);color:#2a2116}
.bottom{position:absolute;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}.nav{font-size:11px;color:#8b93a3;text-align:center}.nav.active{color:var(--blue);font-weight:800}.nav b{display:block;font-size:21px;margin-bottom:3px}
.hero{background:var(--navy);color:#fff;border-radius:24px;padding:22px;margin-bottom:18px}.hero .sub{color:#c8d2e2}.hero .btn{margin-top:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.stat strong{font-size:22px;display:block}.label{font-size:12px;color:var(--muted)}
.input{width:100%;background:#fff;border:1px solid var(--line);padding:14px;border-radius:13px;margin:7px 0 13px;outline:none}.input:focus{border-color:var(--blue)}
.progress{height:7px;background:#e6e9ef;border-radius:99px;overflow:hidden}.progress div{height:100%;background:var(--blue)}
.pill{display:inline-block;padding:8px 11px;border:1px solid var(--line);background:#fff;border-radius:999px;margin:4px;font-size:12px;font-weight:700}.pill.sel{background:#eaf0ff;border-color:#aebfff;color:var(--blue)}
.center{text-align:center;padding-top:70px}.biglogo{font-size:34px;font-weight:950;color:var(--navy)}.biglogo span{color:var(--warm)}
.back{background:none;color:var(--navy);font-size:18px}.headerTitle{font-weight:900}
.toast{position:absolute;top:75px;left:18px;right:18px;background:var(--navy);color:#fff;padding:13px 15px;border-radius:14px;z-index:4;font-size:13px}
.mode{display:flex;gap:10px}.mode .card{flex:1;text-align:center;padding:20px}.mode .card:hover{transform:translateY(-2px)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState}=React;
const services=[["🧹","House Cleaner"],["🍳","Cook"],["👩‍🍼","Babysitter"],["🏠","Maid"],["🧺","Laundry"],["🧑‍💼","Office Boy"]];
const workers=[
 {name:"Maria Khan",job:"House Cleaner",rating:"4.9",jobs:127,exp:"6 years",price:"PKR 3,200",distance:"3 km",initial:"MK"},
 {name:"Ayesha Noor",job:"Housekeeper",rating:"4.8",jobs:98,exp:"5 years",price:"PKR 2,800",distance:"4 km",initial:"AN"},
 {name:"Sana Ali",job:"House Cleaner",rating:"5.0",jobs:164,exp:"8 years",price:"PKR 3,500",distance:"5 km",initial:"SA"}
];

function Header({title,onBack}){return <div className="top">{onBack?<button className="back" onClick={onBack}>‹</button>:<div className="logo">RENT <span>A SERVANT</span></div>}<div className="headerTitle">{title||""}</div><div>⋯</div></div>}
function Nav({tab,setTab,worker=false}){let items=worker?[["⌂","Home"],["◉","Requests"],["▣","Jobs"],["₹","Earnings"],["●","Profile"]]:[["⌂","Home"],["⌕","Search"],["▣","Bookings"],["◌","Messages"],["●","Profile"]];return <div className="bottom">{items.map(([i,n])=><button key={n} className={"nav "+(tab===n?"active":"")} onClick={()=>setTab(n)}><b>{i}</b>{n}</button>)}</div>}
function WorkerCard({w,onView,onHire}){return <div className="card"><div className="worker"><div className="avatar">{w.initial}</div><div style={{flex:1}}><b>{w.name}</b><div className="small">{w.job}</div><div className="stars">★ {w.rating} <span className="small">· {w.jobs} jobs · {w.exp}</span></div><div className="badge">🛡 Verified · ✓ Police Clearance</div></div><div style={{textAlign:"right"}}><div className="price">{w.price}</div><div className="distance">{w.distance}</div></div></div><div className="actions"><button className="btn secondary" onClick={onView}>View Profile</button><button className="btn primary" onClick={onHire}>Hire</button></div></div>}
function Splash({next}){return <div className="content center"><div className="biglogo">RENT <span>A SERVANT</span></div><p className="sub">Find. Verify. Hire.</p><div style={{margin:"55px auto 25px",width:42,height:42,border:"4px solid #dce2ec",borderTopColor:"#2457d6",borderRadius:"50%",animation:"spin 1s linear infinite"}}/><button className="btn primary" onClick={next}>Get Started</button><style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style></div>}
function Onboard({next}){return <><Header/><div className="content"><div className="hero"><div style={{fontSize:42}}>🛡️</div><h1 className="title">Find Trusted Help</h1><p className="sub">Find professionals for your home and workplace.</p></div><div className="card"><h2>Verified Professionals</h2><p className="sub">Every professional goes through our verification process.</p></div><div className="card"><h2>Safety First</h2><p className="sub">Identity verification and mandatory police clearance for service providers.</p></div><div className="card"><h2>Hire With Confidence</h2><p className="sub">Compare professionals, offers, ratings and experience.</p></div><button className="btn primary" onClick={next}>Get Started</button></div></>}
function Auth({next}){return <><Header title="Welcome"/><div className="content"><h1 className="title">Let's get started</h1><p className="sub">Enter your mobile number to continue.</p><input className="input" placeholder="+92 300 1234567"/><button className="btn primary" onClick={next}>Continue</button><div style={{textAlign:"center",margin:"20px"}} className="small">or continue with</div><div className="actions"><button className="btn secondary">Google</button><button className="btn secondary">Apple</button></div></div></>}
function Choose({choose}){return <><Header title="Choose Account"/><div className="content"><h1 className="title">What do you want to do?</h1><p className="sub">Your experience will be tailored to your role.</p><div className="mode"><button className="card" onClick={()=>choose("customer")}><div style={{fontSize:42}}>🏠</div><h3>Hire a Professional</h3><p className="sub">Find and book verified help.</p></button><button className="card" onClick={()=>choose("worker")}><div style={{fontSize:42}}>💼</div><h3>Work as a Professional</h3><p className="sub">Offer your services.</p></button></div></div></>}
function CustomerHome({setTab,setScreen,setSelected}){return <><Header/><div className="content"><p className="sub">Good Morning 👋</p><h1 className="title">What service do you need?</h1><div className="search" onClick={()=>setTab("Search")}>⌕ <span>Search for a service…</span></div><div className="section">Popular Services</div><div className="row">{services.map(s=><button className="service" key={s[1]} onClick={()=>{setSelected(s[1]);setScreen("request")}}><div className="ico">{s[0]}</div><small>{s[1]}</small></button>)}</div><div className="section">Nearby Professionals</div>{workers.slice(0,2).map(w=><WorkerCard key={w.name} w={w} onView={()=>{setSelected(w);setScreen("profileWorker")}} onHire={()=>{setSelected(w);setScreen("hire")}}/>)}<div className="section">Why Rent a Servant?</div><div className="card">✓ Verified Professionals<br/>✓ Police Clearance<br/>✓ Ratings & Reviews<br/>✓ Easy Hiring<br/>✓ Secure Communication</div></div></>}
function Search({setScreen,setSelected}){return <><Header title="Search"/><div className="content"><h1 className="title">Find professionals</h1><div className="search">⌕ <span>House Cleaner</span></div><div className="actions"><button className="btn secondary">☰ Filters</button><button className="btn secondary">↕ Sort</button></div><div className="section">3 Verified Professionals</div>{workers.map(w=><WorkerCard key={w.name} w={w} onView={()=>{setSelected(w);setScreen("profileWorker")}} onHire={()=>{setSelected(w);setScreen("hire")}}/>)}</div></>}
function ProfileWorker({w,setScreen}){return <><Header title="Professional" onBack={()=>setScreen("home")}/><div className="content"><div className="card" style={{textAlign:"center"}}><div className="avatar" style={{margin:"0 auto",width:78,height:78,fontSize:22}}>{w.initial}</div><h2>{w.name}</h2><div className="sub">{w.job}</div><div className="stars">★ {w.rating} · 127 reviews</div><div className="badge">🛡 Rent a Servant Verified</div></div><div className="grid"><div className="stat"><strong>{w.exp}</strong><span className="label">Experience</span></div><div className="stat"><strong>{w.jobs}</strong><span className="label">Jobs Completed</span></div><div className="stat"><strong>10 km</strong><span className="label">Service Area</span></div><div className="stat"><strong>Today</strong><span className="label">Availability</span></div></div><div className="section">Verification</div><div className="card">✓ Identity Verified<br/>✓ CNIC Verified<br/>✓ Police Clearance Verified<br/>✓ Address Verified<br/>✓ Experience Verified</div><div className="section">Skills</div><div>{["Cleaning","Laundry","Ironing","Kitchen Cleaning"].map(x=><span className="pill" key={x}>{x}</span>)}</div><div className="section">About</div><div className="card"><p className="sub">Professional, punctual and experienced in household cleaning and laundry services.</p></div><div className="actions"><button className="btn secondary" onClick={()=>setScreen("chat")}>Chat</button><button className="btn primary" onClick={()=>setScreen("hire")}>Hire Professional</button></div></div></>}
function Request({service,setScreen}){let [step,setStep]=useState(1);return <><Header title="Create Request" onBack={()=>setScreen("home")}/><div className="content"><div className="progress"><div style={{width:step*25+"%"}}/></div><p className="small" style={{marginTop:8}}>Step {step} of 4</p>{step===1&&<><h1 className="title">{service||"House Cleaner"}</h1><p className="sub">What do you need?</p>{["One-time","Daily","Weekly","Monthly","Full-time","Part-time"].map(x=><span className="pill sel" key={x}>{x}</span>)}<div className="section">Requirements</div><div>{["Full House","Bedrooms","Bathrooms","Kitchen","Deep Cleaning","Laundry"].map(x=><span className="pill" key={x}>{x}</span>)}</div><textarea className="input" rows="4" placeholder="Describe your requirements…"/></>}{step===2&&<><h1 className="title">Date & Time</h1><label className="small">Select Date</label><input className="input" type="date"/><label className="small">Start Time</label><input className="input" type="time"/><label className="small">Number of Hours</label><input className="input" type="number" placeholder="5"/></>}{step===3&&<><h1 className="title">Location</h1><button className="btn secondary" style={{marginBottom:10}}>📍 Use Current Location</button><input className="input" placeholder="Enter address"/><div className="card" style={{height:170,display:"grid",placeItems:"center",background:"#e8edf5"}}>🗺️ Map Preview · Location Pin</div></>}{step===4&&<><h1 className="title">Your Budget</h1><p className="sub">Set the expected price for this request.</p><input className="input" placeholder="PKR 3,000"/><div className="card"><b>Request Summary</b><p className="sub">Service: {service||"House Cleaner"}<br/>Date: 10 September<br/>Time: 10 AM – 3 PM<br/>Location: Selected Address<br/>Requirements: Deep cleaning</p></div></>}<div className="actions"><button className="btn secondary" onClick={()=>step>1?setStep(step-1):setScreen("home")}>Back</button><button className="btn primary" onClick={()=>step<4?setStep(step+1):setScreen("offers")}>{step<4?"Continue":"Find Professionals"}</button></div></div></>}
function Offers({setSelected,setScreen}){return <><Header title="Offers"/><div className="content"><h1 className="title">5 Professionals Responded</h1><p className="sub">Compare offers before you hire.</p>{workers.map((w,i)=><div className="card" key={w.name}><div className="worker"><div className="avatar">{w.initial}</div><div style={{flex:1}}><b>{w.name}</b><div className="stars">★ {w.rating}</div><div className="small">{w.exp} · {w.jobs} jobs</div></div><div className="price">{["PKR 3,200","PKR 2,800","PKR 3,500"][i]}</div></div><div className="actions"><button className="btn secondary" onClick={()=>{setSelected(w);setScreen("profileWorker")}}>Compare / View</button><button className="btn primary" onClick={()=>{setSelected(w);setScreen("hire")}}>Select</button></div></div>)}</div></>}
function Hire({w,setScreen,setToast}){return <><Header title="Confirm Hire" onBack={()=>setScreen("home")}/><div className="content"><div className="hero"><div className="small" style={{color:"#c8d2e2"}}>You're hiring</div><h1>{w?.name||"Maria Khan"}</h1><p className="sub">{w?.job||"House Cleaning"} · 10 September · 10 AM – 3 PM</p><div className="price" style={{color:"#fff"}}>{w?.price||"PKR 3,200"}</div></div><div className="card"><b>Are you sure you want to hire this professional?</b><p className="sub">Your booking details will be shared securely with the professional.</p></div><button className="btn primary" onClick={()=>{setScreen("confirmed");setToast("Booking confirmed 🎉")}}>Confirm Hire</button><button className="btn secondary" style={{marginTop:9}} onClick={()=>setScreen("home")}>Cancel</button></div></>}
function Confirmed({setScreen}){return <><Header title="Booking"/><div className="content center" style={{paddingTop:35}}><div style={{fontSize:62}}>🎉</div><h1>Booking Confirmed</h1><p className="sub">Your professional is booked successfully.</p><div className="card" style={{textAlign:"left"}}><b>Maria Khan</b><p className="sub">House Cleaning<br/>10 September · 10 AM<br/>PKR 3,200</p><span className="badge">✓ Confirmed</span></div><div className="actions"><button className="btn secondary" onClick={()=>setScreen("chat")}>Chat</button><button className="btn primary" onClick={()=>setScreen("bookings")}>View Booking</button></div></div></>}
function Chat(){return <><Header title="Messages"/><div className="content"><div className="card"><b>Maria Khan</b><span className="badge">✓ Verified</span></div><div className="card" style={{marginTop:250}}>Hi! I’ll arrive by 10 AM. See you tomorrow.</div><input className="input" placeholder="Write a message…"/><button className="btn primary">Send</button></div></>}
function Bookings(){return <><Header title="Bookings"/><div className="content"><div className="actions"><button className="btn primary">Active</button><button className="btn secondary">Upcoming</button><button className="btn secondary">Completed</button></div><div className="card"><div className="badge">● Upcoming</div><h3>House Cleaning</h3><p className="sub">Maria Khan · 10 September · 10 AM – 3 PM</p><div className="price">PKR 3,200</div><div className="actions"><button className="btn secondary">Chat</button><button className="btn primary">View</button></div></div></div></>}
function WorkerHome({setScreen}){return <><Header/><div className="content"><p className="sub">Good Morning, Maria</p><h1 className="title">Ready to work?</h1><div className="hero"><div className="small" style={{color:"#c8d2e2"}}>Availability</div><h2>🟢 ONLINE</h2><p className="sub">You are visible to nearby customers.</p><button className="btn warm">Go Offline</button></div><div className="grid"><div className="stat"><strong>2</strong><span className="label">Today's Jobs</span></div><div className="stat"><strong>5</strong><span className="label">New Requests</span></div><div className="stat"><strong>PKR 4,500</strong><span className="label">Earnings</span></div><div className="stat"><strong>4.9 ★</strong><span className="label">Rating</span></div></div><div className="section">Verification</div><div className="card">✓ Phone verified<br/>✓ Identity verified<br/>✓ CNIC verified<br/>✓ Selfie verified<br/>✓ Police Clearance verified<br/><span className="badge">🛡 Fully Verified</span></div><button className="btn primary" onClick={()=>setScreen("requests")}>View New Requests</button></div></>}
function WorkerRequests({setScreen}){return <><Header title="Requests"/><div className="content"><div className="actions"><button className="btn primary">New 5</button><button className="btn secondary">Pending</button><button className="btn secondary">Accepted</button></div><div className="card"><div className="badge">New Request</div><h2>House Cleaning</h2><p className="sub">📍 4 km away · 📅 10 Sep · ⏰ 10 AM – 3 PM</p><div className="price">Customer Budget: PKR 3,000</div><p className="sub">Deep cleaning</p><div className="actions"><button className="btn primary" onClick={()=>setScreen("job")}>Accept</button><button className="btn warm">Make an Offer</button><button className="btn secondary">Decline</button></div></div></div></>}
function Job({setToast}){return <><Header title="Upcoming Job"/><div className="content"><div className="card"><div className="badge">Confirmed</div><h2>House Cleaning</h2><p className="sub">Customer: Ahmed Khan<br/>📍 Selected Address<br/>📅 10 September<br/>⏰ 10 AM – 3 PM</p><div className="price">PKR 3,200</div></div><button className="btn secondary">🧭 Start Navigation</button><button className="btn primary" style={{marginTop:10}} onClick={()=>setToast("Customer notified: professional has arrived.")}>I've Arrived</button><div className="section">Start Job OTP</div><input className="input" placeholder="Enter 6-digit OTP"/><button className="btn primary" onClick={()=>setToast("Job Started")}>Start Job</button></div></>}
function App(){let [screen,setScreen]=useState("splash"),[role,setRole]=useState(null),[tab,setTab]=useState("Home"),[selected,setSelected]=useState("House Cleaner"),[toast,setToast]=useState("");const navTab=t=>{setTab(t); if(role==="worker"){if(t==="Home")setScreen("workerHome");if(t==="Requests")setScreen("requests");if(t==="Jobs")setScreen("job");}else{if(t==="Home")setScreen("home");if(t==="Search")setScreen("search");if(t==="Bookings")setScreen("bookings");if(t==="Messages")setScreen("chat");}};if(toast)setTimeout(()=>setToast(""),2400);let body={splash:<Splash next={()=>setScreen("onboard")}/>,onboard:<Onboard next={()=>setScreen("auth")}/>,auth:<Auth next={()=>setScreen("choose")}/>,choose:<Choose choose={r=>{setRole(r);setScreen(r==="customer"?"home":"workerHome")}}/>,home:<CustomerHome setTab={navTab} setScreen={setScreen} setSelected={setSelected}/>,search:<Search setScreen={setScreen} setSelected={setSelected}/>,request:<Request service={typeof selected==="string"?selected:"House Cleaner"} setScreen={setScreen}/>,offers:<Offers setSelected={setSelected} setScreen={setScreen}/>,profileWorker:<ProfileWorker w={typeof selected==="object"?selected:workers[0]} setScreen={setScreen}/>,hire:<Hire w={typeof selected==="object"?selected:workers[0]} setScreen={setScreen} setToast={setToast}/>,confirmed:<Confirmed setScreen={setScreen}/>,chat:<Chat/>,bookings:<Bookings/>,workerHome:<WorkerHome setScreen={setScreen}/>,requests:<WorkerRequests setScreen={setScreen}/>,job:<Job setToast={setToast}/>}[screen];let showNav=["home","search","bookings","chat","workerHome","requests","job"].includes(screen);return <div className="app"><div className="phone">{toast&&<div className="toast">{toast}</div>}{body}{showNav&&<Nav tab={tab} setTab={navTab} worker={role==="worker"}/>}</div></div>}ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
