<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Rent a Servant — Prototype</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0d1b3e;
            --primary-light: #1a2a5a;
            --primary-dark: #060f24;
            --accent: #d4a853;
            --accent-light: #e8c87a;
            --accent-glow: rgba(212, 168, 83, 0.25);
            --bg: #f4f6fb;
            --bg-card: #ffffff;
            --bg-input: #f0f2f7;
            --bg-dark: #121826;
            --bg-card-dark: #1a2035;
            --bg-input-dark: #252d45;
            --text: #0d1b3e;
            --text-secondary: #4a5270;
            --text-muted: #8a94b0;
            --text-dark: #e8ecf4;
            --text-secondary-dark: #b0b8d0;
            --border: #e2e6ef;
            --border-dark: #2a3350;
            --shadow: 0 8px 32px rgba(13, 27, 62, 0.08);
            --shadow-hover: 0 12px 48px rgba(13, 27, 62, 0.14);
            --shadow-dark: 0 8px 32px rgba(0, 0, 0, 0.3);
            --radius: 20px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 12px);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: #0d111f;
            --bg-card: #181f33;
            --bg-input: #232b42;
            --text: #e8ecf4;
            --text-secondary: #b0b8d0;
            --text-muted: #6a7490;
            --border: #2a3350;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.5);
        }

        html,
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100%;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background var(--transition), color var(--transition);
        }

        #app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            background: var(--bg);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.06);
            transition: background var(--transition);
        }

        .screen-container {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 20px 80px 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
            transform: translateY(8px);
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .screen-container.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .screen-container::-webkit-scrollbar {
            width: 3px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        .flex {
            display: flex;
        }
        .flex-col {
            flex-direction: column;
        }
        .items-center {
            align-items: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .justify-center {
            justify-content: center;
        }
        .gap-1 {
            gap: 4px;
        }
        .gap-2 {
            gap: 8px;
        }
        .gap-3 {
            gap: 12px;
        }
        .gap-4 {
            gap: 16px;
        }
        .gap-5 {
            gap: 20px;
        }
        .gap-6 {
            gap: 24px;
        }
        .gap-8 {
            gap: 32px;
        }
        .w-full {
            width: 100%;
        }
        .text-center {
            text-align: center;
        }
        .relative {
            position: relative;
        }
        .mt-1 {
            margin-top: 4px;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-3 {
            margin-top: 12px;
        }
        .mt-4 {
            margin-top: 16px;
        }
        .mt-5 {
            margin-top: 20px;
        }
        .mt-6 {
            margin-top: 24px;
        }
        .mt-8 {
            margin-top: 32px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .mb-3 {
            margin-bottom: 12px;
        }
        .mb-4 {
            margin-bottom: 16px;
        }
        .mb-5 {
            margin-bottom: 20px;
        }
        .mb-6 {
            margin-bottom: 24px;
        }
        .px-2 {
            padding-left: 8px;
            padding-right: 8px;
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .tag-verified {
            background: #e3f5e9;
            color: #0a7a3a;
        }
        .tag-pending {
            background: #fff3d6;
            color: #a86e00;
        }
        .tag-rejected {
            background: #fde8e8;
            color: #b91c1c;
        }
        .tag-police {
            background: #dbeafe;
            color: #1a56db;
        }
        .tag-badge {
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 100px;
            font-weight: 600;
        }
        [data-theme="dark"] .tag-verified {
            background: #0a2e1a;
            color: #4ade80;
        }
        [data-theme="dark"] .tag-pending {
            background: #3d2e00;
            color: #fbbf24;
        }
        [data-theme="dark"] .tag-rejected {
            background: #3d0a0a;
            color: #f87171;
        }
        [data-theme="dark"] .tag-police {
            background: #0a1a3d;
            color: #60a5fa;
        }
        [data-theme="dark"] .tag-badge {
            background: var(--accent);
            color: #0d1b3e;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            min-height: 52px;
            width: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 16px rgba(13, 27, 62, 0.2);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(13, 27, 62, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-accent {
            background: var(--accent);
            color: #0d1b3e;
            box-shadow: 0 4px 16px rgba(212, 168, 83, 0.3);
        }
        .btn-accent:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(212, 168, 83, 0.4);
        }
        .btn-accent:active {
            transform: scale(0.97);
        }

        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 2px solid var(--border);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-outline-accent {
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
        }
        .btn-outline-accent:hover {
            background: var(--accent);
            color: #0d1b3e;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            padding: 8px 16px;
            min-height: auto;
            width: auto;
        }
        .btn-ghost:hover {
            color: var(--text);
        }

        .btn-sm {
            padding: 10px 18px;
            font-size: 13px;
            min-height: 40px;
            width: auto;
        }

        .btn-icon {
            width: 48px;
            height: 48px;
            padding: 0;
            border-radius: 50%;
            min-height: auto;
            flex-shrink: 0;
        }

        [data-theme="dark"] .btn-primary {
            background: var(--accent);
            color: #0d1b3e;
            box-shadow: 0 4px 16px rgba(212, 168, 83, 0.25);
        }
        [data-theme="dark"] .btn-outline {
            border-color: var(--border-dark);
            color: var(--text-secondary-dark);
        }
        [data-theme="dark"] .btn-outline-accent {
            border-color: var(--accent);
            color: var(--accent);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .input-group input,
        .input-group textarea,
        .input-group select {
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            background: var(--bg-input);
            color: var(--text);
            transition: all var(--transition);
            width: 100%;
            outline: none;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .input-group .input-icon {
            position: relative;
        }
        .input-group .input-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }
        .input-group .input-icon input {
            padding-left: 48px;
        }

        [data-theme="dark"] .input-group input,
        [data-theme="dark"] .input-group textarea {
            background: var(--bg-input-dark);
            border-color: var(--border-dark);
            color: var(--text-dark);
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 4px calc(8px + var(--safe-bottom));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            transition: background var(--transition), border-color var(--transition);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 12px;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            min-width: 52px;
            font-family: 'Inter', sans-serif;
        }

        .bottom-nav .nav-item i {
            font-size: 22px;
            transition: all var(--transition);
        }

        .bottom-nav .nav-item.active {
            color: var(--accent);
        }
        .bottom-nav .nav-item.active i {
            transform: scale(1.05);
        }

        .bottom-nav .nav-item .badge {
            position: absolute;
            top: 0;
            right: 4px;
            background: #ef4444;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        [data-theme="dark"] .bottom-nav {
            background: var(--bg-card-dark);
            border-color: var(--border-dark);
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 12px 0;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
            transition: background var(--transition);
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-header .brand .logo {
            font-weight: 800;
            font-size: 18px;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .app-header .brand .logo span {
            color: var(--accent);
        }
        [data-theme="dark"] .app-header .brand .logo {
            color: var(--text-dark);
        }

        .app-header .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .app-header .header-actions button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-header .header-actions button:hover {
            background: var(--border);
        }
        [data-theme="dark"] .app-header .header-actions button {
            background: var(--bg-input-dark);
            color: var(--text-secondary-dark);
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            border: 1px solid transparent;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }
        [data-theme="dark"] .card {
            background: var(--bg-card-dark);
            border-color: var(--border-dark);
        }

        .card-service {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            cursor: pointer;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .card-service:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .card-service .icon-wrap {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            background: var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--accent);
            flex-shrink: 0;
        }
        [data-theme="dark"] .card-service {
            background: var(--bg-card-dark);
            border-color: var(--border-dark);
        }

        .worker-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            cursor: pointer;
            border: 1px solid transparent;
        }
        .worker-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .worker-card .top {
            display: flex;
            gap: 14px;
        }
        .worker-card .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--accent);
            flex-shrink: 0;
            font-weight: 600;
        }
        .worker-card .info {
            flex: 1;
            min-width: 0;
        }
        .worker-card .info .name {
            font-weight: 600;
            font-size: 15px;
        }
        .worker-card .info .profession {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .worker-card .info .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .worker-card .info .meta i {
            margin-right: 3px;
            font-size: 11px;
        }
        .worker-card .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .worker-card .bottom .price {
            font-weight: 700;
            font-size: 16px;
            color: var(--primary);
        }
        .worker-card .bottom .actions {
            display: flex;
            gap: 8px;
        }
        .worker-card .bottom .actions button {
            padding: 6px 16px;
            border: none;
            border-radius: var(--radius-xs);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .worker-card .bottom .actions .btn-hire {
            background: var(--accent);
            color: #0d1b3e;
        }
        .worker-card .bottom .actions .btn-hire:hover {
            transform: scale(1.04);
        }
        .worker-card .bottom .actions .btn-view {
            background: var(--bg-input);
            color: var(--text-secondary);
        }
        .worker-card .bottom .actions .btn-view:hover {
            background: var(--border);
        }
        [data-theme="dark"] .worker-card {
            background: var(--bg-card-dark);
            border-color: var(--border-dark);
        }
        [data-theme="dark"] .worker-card .bottom .price {
            color: var(--accent-light);
        }
        [data-theme="dark"] .worker-card .bottom .actions .btn-view {
            background: var(--bg-input-dark);
            color: var(--text-secondary-dark);
        }

        .onboarding-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }
        .onboarding-dots .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            transition: all var(--transition);
        }
        .onboarding-dots .dot.active {
            background: var(--accent);
            width: 28px;
            border-radius: 4px;
        }

        .onboarding-illustration {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            color: var(--accent);
            margin: 20px auto 30px;
        }

        .verification-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e3f5e9;
            color: #0a7a3a;
            padding: 4px 14px 4px 10px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
        }
        .verification-badge i {
            font-size: 14px;
        }
        [data-theme="dark"] .verification-badge {
            background: #0a2e1a;
            color: #4ade80;
        }

        .verification-badge-police {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #dbeafe;
            color: #1a56db;
            padding: 4px 14px 4px 10px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
        }
        .verification-badge-police i {
            font-size: 14px;
        }
        [data-theme="dark"] .verification-badge-police {
            background: #0a1a3d;
            color: #60a5fa;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 0;
        }
        .profile-header .avatar-lg {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: var(--accent);
            font-weight: 600;
            flex-shrink: 0;
            border: 3px solid var(--accent);
        }
        .profile-header .info h2 {
            font-size: 18px;
            font-weight: 700;
        }
        .profile-header .info p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .verification-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .verification-list .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .verification-list .item:last-child {
            border-bottom: none;
        }
        .verification-list .item i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }
        .verification-list .item .status {
            margin-left: auto;
            font-weight: 600;
            font-size: 13px;
        }
        .verification-list .item .status.verified {
            color: #0a7a3a;
        }
        .verification-list .item .status.pending {
            color: #a86e00;
        }
        [data-theme="dark"] .verification-list .item .status.verified {
            color: #4ade80;
        }
        [data-theme="dark"] .verification-list .item .status.pending {
            color: #fbbf24;
        }

        .request-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--accent);
            transition: all var(--transition);
        }
        .request-card:hover {
            box-shadow: var(--shadow-hover);
        }
        .request-card .top {
            display: flex;
            justify-content: space-between;
            align-items: start;
        }
        .request-card .top .service {
            font-weight: 600;
            font-size: 15px;
        }
        .request-card .top .distance {
            font-size: 13px;
            color: var(--text-muted);
        }
        .request-card .details {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .request-card .details i {
            margin-right: 4px;
            width: 16px;
        }

                                        <i className="fa-solid fa-upload" /> Upload
                                    </button>
                                </div>
                                <div className="input-group" style={{ marginTop: 10 }}><label>Certificate Number</label>
                                    <input placeholder="Enter certificate number" />
                                </div>
                                <div className="input-group" style={{ marginTop: 10 }}><label>Issuing Authority</label>
                                    <input placeholder="e.g. District Police" />
                                </div>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 10 }}>
                                    <div className="input-group"><label>Issue Date</label><input type="date" /></div>
                                    <div className="input-group"><label>Expiry Date</label><input type="date" /></div>
                                </div>
                                <button className="btn btn-accent" style={{ marginTop: 12 }} onClick={nextWorkerStep}>
                                    Submit for Verification
                                </button>
                            </div>
                        )}

                        {workerStep === 4 && (
                            <div style={{ marginTop: 12 }}>
                                <div className="input-group"><label>Select Profession</label>
                                    <select value={workerForm.profession} onChange={e => setWorkerForm(f => ({ ...f,
                                            profession: e.target.value }))}>
                                        {['House Cleaner', 'Cook', 'Babysitter', 'Maid', 'Laundry Worker', 'Driver',
                                            'Electrician', 'Plumber', 'Carpenter', 'Painter', 'Office Boy',
                                            'Security Guard', 'Gardener'
                                        ].map(p => <option key={p} value={p}>{p}</option>)}
                                    </select>
                                </div>
                                <div className="input-group" style={{ marginTop: 10 }}><label>Total Experience</label>
                                    <select value={workerForm.experience} onChange={e => setWorkerForm(f => ({ ...f,
                                            experience: e.target.value }))}>
                                        <option>No experience</option>
                                        <option>Less than 1 year</option>
                                        <option>1–2 years</option>
                                        <option>2–5 years</option>
                                        <option>5–10 years</option>
                                        <option>10+ years</option>
                                    </select>
                                </div>
                                <button className="btn btn-accent" style={{ marginTop: 16 }} onClick={nextWorkerStep}>
                                    Next
                                </button>
                            </div>
                        )}

                        {workerStep === 5 && (
                            <div style={{ marginTop: 12 }}>
                                <div className="input-group"><label>Skills</label>
                                    <div className="chip-group" style={{ marginTop: 6 }}>
                                        {['Cleaning', 'Laundry', 'Ironing', 'Kitchen', 'Bathroom', 'Dusting',
                                            'Mopping'
                                        ].map(s => (
                                            <span key={s} className={`chip ${workerForm.skills.includes(s) ? 'active' : ''}`}
                                            onClick={() => {
                                                const set = new Set(workerForm.skills);
                                                if (set.has(s)) set.delete(s);
                                                else set.add(s);
                                                setWorkerForm(f => ({ ...f, skills: [...set] }));
                                            }}>
                                                {s}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                                <div className="input-group" style={{ marginTop: 10 }}><label>Bio</label>
                                    <textarea value={workerForm.bio} onChange={e => setWorkerForm(f => ({ ...f,
                                            bio: e.target.value }))}
                                    placeholder="Tell customers about yourself..." />
                                </div>
                                <button className="btn btn-accent" style={{ marginTop: 16 }} onClick={nextWorkerStep}>
                                    Next
                                </button>
                            </div>
                        )}

                        {workerStep === 6 && (
                            <div style={{ marginTop: 12 }}>
                                <div className="card" style={{ background: 'var(--bg-input)' }}>
                                    <p style={{ fontSize: 13, color: 'var(--text-muted)' }}>Review your application</p>
                                    <div style={{ marginTop: 8 }}>
                                        <p><strong>Name:</strong> {workerForm.name || '—'}</p>
                                        <p><strong>CNIC:</strong> {workerForm.cnic || '—'}</p>
                                        <p><strong>Profession:</strong> {workerForm.profession}</p>
                                        <p><strong>Experience:</strong> {workerForm.experience}</p>
                                        <p><strong>Skills:</strong> {workerForm.skills.join(', ') || '—'}</p>
                                    </div>
                                    <div style={{ marginTop: 10 }}>
                                        <span className="tag-pending">🟡 Pending Verification</span>
                                        <span className="tag-police" style={{ marginLeft: 6 }}>🟡 Police Clearance Pending</span>
                                    </div>
                                </div>
                                <button className="btn btn-accent" style={{ marginTop: 12 }} onClick={nextWorkerStep}>
                                    Submit Application
                                </button>
                            </div>
                        )}
                    </div>
                );
            };

            // ---- REQUEST CARD ----
            const RequestCard = ({ request, onAccept, onOffer }) => {
                return (
                    <div className="request-card" style={{ marginBottom: 10 }}>
                        <div className="top">
                            <span className="service">{request.service}</span>
                            <span className="distance">📍 {request.distance}</span>
                        </div>
                        <div className="details">
                            <span><i className="fa-regular fa-calendar" /> {request.date}</span>
                            <span><i className="fa-regular fa-clock" /> {request.time}</span>
                            <span><i className="fa-regular fa-user" /> {request.customer}</span>
                        </div>
                        <div className="budget">💰 Customer Budget: PKR {request.budget.toLocaleString()}</div>
                        <div style={{ fontSize: 13, color: 'var(--text-secondary)', marginTop: 4 }}>
                            <i className="fa-regular fa-file-lines" /> {request.requirements}
                        </div>
                        <div className="actions">
                            <button className="accept" onClick={() => onAccept(request)}>Accept</button>
                            <button className="offer" onClick={() => onOffer(request)}>Make Offer</button>
                            <button className="decline" onClick={() => showToast('Request declined')}>Decline</button>
                        </div>
                    </div>
                );
            };

            // ---- WORKER HOME ----
            const WorkerHome = () => {
                return (
                    <div className="screen-container active">
                        <div className="app-header">
                            <div className="brand"><span className="logo">RENT A <span>SERVANT</span></span></div>
                            <div className="header-actions">
                                <button onClick={toggleTheme}>
                                    <i className={theme === 'light' ? 'fa-regular fa-moon' : 'fa-regular fa-sun'} />
                                </button>
                            </div>
                        </div>
                        <div>
                            <p style={{ fontSize: 14, color: 'var(--text-secondary)' }}>Good Morning 👋</p>
                            <h2 style={{ fontSize: 20, fontWeight: 700, marginTop: 2 }}>Maria Khan</h2>
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 12,
                                padding: '12px 16px', background: 'var(--bg-card)', borderRadius: 'var(--radius-sm)',
                                boxShadow: 'var(--shadow)' }}>
                            <div className="toggle-wrap">
                                <span className="toggle-label">Availability</span>
                                <div className={`toggle ${workerOnline ? 'active' : ''}`}
                                onClick={() => setWorkerOnline(!workerOnline)}>
                                    <div className="thumb" />
                                </div>
                            </div>
                            <span style={{ fontSize: 13, fontWeight: 500, color: workerOnline ? '#0a7a3a' :
                                    'var(--text-muted)' }}>
                                {workerOnline ? '🟢 Online' : '🔴 Offline'}
                            </span>
                        </div>
                        <div className="stats-row">
                            <div className="stat"><div className="value">2</div><div className="label">Today's Jobs</div></div>
                            <div className="stat"><div className="value">5</div><div className="label">New Requests</div></div>
                            <div className="stat"><div className="value">PKR 4.5k</div><div className="label">Earnings</div></div>
                            <div className="stat"><div className="value">4.9</div><div className="label">Rating</div></div>
                        </div>
                        <div style={{ marginTop: 8 }}>
                            <div className="section-title">
                                <span>New Requests</span>
                                <span className="see-all" onClick={() => { setWorkerTab('requests');
                                        goTo('worker-requests'); }}>See All</span>
                            </div>
                            {WORKER_REQUESTS.slice(0, 2).map(req => (
                                <RequestCard key={req.id} request={req} onAccept={acceptRequest} onOffer={makeOffer} />
                            ))}
                        </div>
                        <div style={{ marginTop: 12 }}>
                            <div className="section-title"><span>Today's Jobs</span></div>
                            <div className="card" style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                                <div className="avatar" style={{ width: 44, height: 44, fontSize: 16 }}>AK</div>
                                <div style={{ flex: 1 }}>
                                    <div style={{ fontWeight: 600 }}>Ayesha Khan</div>
                                    <div style={{ fontSize: 13, color: 'var(--text-secondary)' }}>House Cleaning • 10 AM</div>
                                </div>
                                <span className="tag-police">Active</span>
                            </div>
                        </div>
                        <BottomNavWorker active={workerTab} setActive={(t) => { setWorkerTab(t);
                                goTo(t === 'home' ? 'worker-home' : t === 'requests' ? 'worker-requests' :
                                    t === 'jobs' ? 'worker-jobs' : t === 'earnings' ? 'worker-earnings' :
                                    'worker-profile-page'); }} />
                    </div>
                );
            };

            // ---- WORKER REQUESTS ----
            const WorkerRequests = () => {
                const [tab, setTab] = useState('new');
                const requests = tab === 'new' ? WORKER_REQUESTS : tab === 'pending' ? WORKER_REQUESTS.slice(0, 1) : [];
                return (
                    <div className="screen-container active">
                        <div className="app-header"><span style={{ fontWeight: 700, fontSize: 18 }}>Requests</span></div>
                        <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
                            {['new', 'pending', 'accepted', 'declined'].map(t => (
                                <button key={t} className={`btn ${tab === t ? 'btn-accent' : 'btn-outline'}`}
                                style={{ flex: 1, padding: '8px 0', minHeight: 36, fontSize: 12 }}
                                onClick={() => setTab(t)}>
                                    {t.charAt(0).toUpperCase() + t.slice(1)}
                                </button>
                            ))}
                        </div>
                        {requests.length === 0 ? (
                            <div className="card" style={{ textAlign: 'center', padding: 40 }}>
                                <i className="fa-regular fa-inbox" style={{ fontSize: 40, color: 'var(--text-muted)' }} />
                                <p style={{ marginTop: 12, color: 'var(--text-secondary)' }}>No {tab} requests</p>
                            </div>
                        ) : (
                            requests.map(req => <RequestCard key={req.id} request={req} onAccept={acceptRequest}
                                onOffer={makeOffer} />)
                        )}
                        <BottomNavWorker active="requests" setActive={(t) => { setWorkerTab(t);
                                goTo(t === 'home' ? 'worker-home' : t === 'requests' ? 'worker-requests' :
                                    t === 'jobs' ? 'worker-jobs' : t === 'earnings' ? 'worker-earnings' :
                                    'worker-profile-page'); }} />
                    </div>
                );
            };

            // ---- WORKER JOBS ----
            const WorkerJobs = () => {
                return (
                    <div className="screen-container active">
                        <div className="app-header"><span style={{ fontWeight: 700, fontSize: 18 }}>My Jobs</span></div>
                        <div className="card" style={{ marginBottom: 10 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <div><div style={{ fontWeight: 600 }}>Ayesha Khan</div>
                                    <div style={{ fontSize: 13, color: 'var(--text-secondary)' }}>House Cleaning</div>
                                </div>
                                <span className="tag-police">In Progress</span>
                            </div>
                            <div style={{ fontSize: 13, color: 'var(--text-muted)', marginTop: 4 }}>
                                <i className="fa-regular fa-clock" /> Started: 10:02 AM
                            </div>
                            <div style={{ fontSize: 20, fontWeight: 700, color: 'var(--accent)', marginTop: 4 }}>
                                02:35:21
                            </div>
                            <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                                <button className="btn btn-outline btn-sm" style={{ flex: 1 }}
                                onClick={() => goTo('chat')}>
                                    <i className="fa-regular fa-comment" /> Contact
                                </button>
                                <button className="btn btn-accent btn-sm" style={{ flex: 1 }} onClick={completeJob}>
                                    <i className="fa-solid fa-check" /> Complete
                                </button>
                            </div>
                        </div>
                        <div className="card" style={{ marginBottom: 10 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <div><div style={{ fontWeight: 600 }}>Bilal Ahmed</div>
                                    <div style={{ fontSize: 13, color: 'var(--text-secondary)' }}>Cooking Service</div>
                                </div>
                                <span className="tag-pending">Upcoming</span>
                            </div>
                            <div style={{ fontSize: 13, color: 'var(--text-muted)', marginTop: 4 }}>
                                <i className="fa-regular fa-calendar" /> 12 Sep • 1:00 PM
                            </div>
                        </div>
                        <BottomNavWorker active="jobs" setActive={(t) => { setWorkerTab(t);
                                goTo(t === 'home' ? 'worker-home' : t === 'requests' ? 'worker-requests' :
                                    t === 'jobs' ? 'worker-jobs' : t === 'earnings' ? 'worker-earnings' :
                                    'worker-profile-page'); }} />
                    </div>
                );
            };

            // ---- WORKER EARNINGS ----
            const WorkerEarnings = () => {
                return (
                    <div className="screen-container active">
                        <div className="app-header"><span style={{ fontWeight: 700, fontSize: 18 }}>Earnings</span></div>
                        <div className="card" style={{ textAlign: 'center', padding: 24 }}>
                            <div style={{ fontSize: 14, color: 'var(--text-muted)' }}>Total Earnings</div>
                            <div style={{ fontSize: 36, fontWeight: 800, color: 'var(--accent)', marginTop: 4 }}>PKR 18,500</div>
                            <div style={{ fontSize: 13, color: 'var(--text-secondary)' }}>This month</div>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 12 }}>
                            <div className="card" style={{ textAlign: 'center', padding: 14 }}>
                                <div style={{ fontSize: 14, fontWeight: 700 }}>12</div>
                                <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>Jobs Done</div>
                            </div>
                            <div className="card" style={{ textAlign: 'center', padding: 14 }}>
                                <div style={{ fontSize: 14, fontWeight: 700 }}>4.9</div>
                                <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>Avg Rating</div>
                            </div>
                        </div>
                        <div style={{ marginTop: 12 }}>
                            <div className="section-title"><span>Recent Payments</span></div>
                            {[
                                { job: 'House Cleaning', amount: 3200, date: '10 Sep' },
                                { job: 'Cooking Service', amount: 3500, date: '8 Sep' },
                                { job: 'House Cleaning', amount: 2800, date: '5 Sep' },
                            ].map((p, i) => (
                                <div key={i} className="card" style={{ marginBottom: 6, display: 'flex',
                                        justifyContent: 'space-between', alignItems: 'center' }}>
                                    <div><div style={{ fontWeight: 500 }}>{p.job}</div>
                                        <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{p.date}</div></div>
                                    <div style={{ fontWeight: 700, color: 'var(--accent)' }}>+PKR {p.amount}</div>
                                </div>
                            ))}
                        </div>
                        <BottomNavWorker active="earnings" setActive={(t) => { setWorkerTab(t);
                                goTo(t === 'home' ? 'worker-home' : t === 'requests' ? 'worker-requests' :
                                    t === 'jobs' ? 'worker-jobs' : t === 'earnings' ? 'worker-earnings' :
                                    'worker-profile-page'); }} />
                    </div>
                );
            };

            // ---- WORKER PROFILE PAGE ----
            const WorkerProfilePage = () => {
                return (
                    <div className="screen-container active">
                        <div className="app-header">
                            <span style={{ fontWeight: 700, fontSize: 18 }}>My Profile</span>
                            <button className="btn btn-ghost" style={{ width: 'auto', padding: '8px 0' }}
                            onClick={() => showToast('Edit profile')}>
                                <i className="fa-solid fa-pen" />
                            </button>
                        </div>
                        <div className="profile-header">
                            <div className="avatar-lg" style={{ fontSize: 28 }}>MK</div>
                            <div className="info">
                                <h2>Maria Khan</h2>
                                <p>House Cleaner</p>
                                <div style={{ display: 'flex', gap: 6, marginTop: 4, flexWrap: 'wrap' }}>
                                    <span className="verification-badge"><i className="fa-solid fa-shield-check" /> Verified</span>
                                    <span className="verification-badge-police"><i className="fa-solid fa-badge-check" /> Police ✓</span>
                                </div>
                            </div>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
                            <div className="card" style={{ textAlign: 'center', padding: '10px 4px' }}>
                                <div style={{ fontWeight: 700, fontSize: 16 }}>4.9</div>
                                <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>Rating</div>
                            </div>
                            <div className="card" style={{ textAlign: 'center', padding: '10px 4px' }}>
                                <div style={{ fontWeight: 700, fontSize: 16 }}>6 yrs</div>
                                <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>Experience</div>
                            </div>
                            <div className="card" style={{ textAlign: 'center', padding: '10px 4px' }}>
                                <div style={{ fontWeight: 700, fontSize: 16 }}>127</div>
                                <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>Jobs</div>
                            </div>
                        </div>
                        <div className="card" style={{ marginTop: 12 }}>
                            <h4 style={{ fontWeight: 600, marginBottom: 6 }}>Verification Status</h4>
                            <div className="verification-list">
                                <div className="item"><i className="fa-solid fa-id-card" /> Identity Verified <span className="status verified">✓</span></div>
                                <div className="item"><i className="fa-solid fa-id-card" /> CNIC Verified <span className="status verified">✓</span></div>
                                <div className="item"><i className="fa-solid fa-badge-check" /> Police Clearance <span className="status verified">✓</span></div>
                                <div className="item"><i className="fa-solid fa-certificate" /> Experience Verified <span className="status verified">✓</span></div>
                            </div>
                        </div>
                        <div className="card" style={{ marginTop: 12 }}>
                            <h4 style={{ fontWeight: 600, marginBottom: 6 }}>Skills</h4>
                            <div className="chip-group">
                                {['Cleaning', 'Laundry', 'Ironing', 'Kitchen', 'Dusting'].map(s => (
                                    <span key={s} className="chip active" style={{ background: 'var(--bg-input)',
                                            color: 'var(--text-secondary)' }}>{s}</span>
                                ))}
                            </div>
                        </div>
                        <button className="btn btn-outline" style={{ marginTop: 12, color: '#ef4444',
                                borderColor: '#ef4444' }}>
                            Logout
                        </button>
                        <BottomNavWorker active="profile" setActive={(t) => { setWorkerTab(t);
                                goTo(t === 'home' ? 'worker-home' : t === 'requests' ? 'worker-requests' :
                                    t === 'jobs' ? 'worker-jobs' : t === 'earnings' ? 'worker-earnings' :
                                    'worker-profile-page'); }} />
                    </div>
                );
            };

            // ---- MODAL ----
            const Modal = () => {
                if (!showModal) return null;
                const isHire = modalAction === 'hire';
                const worker = isHire ? selectedWorker : selectedOffer;
                return (
                    <div className="modal-overlay show" onClick={() => setShowModal(false)}>
                        <div className="modal-box" onClick={e => e.stopPropagation()}>
                            <h3>{isHire ? 'Hire Professional' : 'Accept Offer'}</h3>
                            <p>
                                {isHire ? `Are you sure you want to hire ${worker?.name}?` :
                                    `You are about to accept the offer from ${worker?.name} for PKR ${worker?.price?.toLocaleString()}`}
                            </p>
                            {isHire && worker && (
                                <div style={{ fontSize: 13, color: 'var(--text-secondary)', marginBottom: 12 }}>
                                    <div><strong>Service:</strong> {worker.profession}</div>
                                    <div><strong>Date:</strong> 10 September 2026</div>
                                    <div><strong>Time:</strong> 10:00 AM</div>
                                    <div><strong>Price:</strong> PKR {worker.price.toLocaleString()}</div>
                                </div>
                            )}
                            <div className="actions">
                                <button className="cancel" onClick={() => setShowModal(false)}>Cancel</button>
                                <button className="confirm" onClick={isHire ? confirmHire : confirmAcceptOffer}>
                                    {isHire ? 'Confirm Hire' : 'Accept'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // ---- ROUTER ----
            const renderScreen = () => {
                switch (screen) {
                    case 'splash':
                        return <SplashScreen />;
                    case 'onboarding':
                        return <OnboardingScreen />;
                    case 'login':
                        return <LoginScreen />;
                    case 'choose-account':
                        return <ChooseAccountScreen />;
                    case 'customer-home':
                        return <CustomerHome />;
                    case 'search':
                        return <SearchScreen />;
                    case 'worker-profile':
                        return <WorkerProfileScreen />;
                    case 'create-request':
                        return <CreateRequestScreen />;
                    case 'offers':
                        return <OffersScreen />;
                    case 'customer-bookings':
                        return <CustomerBookings />;
                    case 'chat':
                        return <ChatScreen />;
                    case 'customer-profile':
                        return <CustomerProfile />;
                    case 'safety':
                        return <SafetyScreen />;
                    case 'customer-notifications':
                        return <NotificationsScreen />;
                    case 'settings':
                        return <SettingsScreen />;
                    case 'worker-register':
                        return <WorkerRegister />;
                    case 'worker-home':
                        return <WorkerHome />;
                    case 'worker-requests':
                        return <WorkerRequests />;
                    case 'worker-jobs':
                        return <WorkerJobs />;
                    case 'worker-earnings':
                        return <WorkerEarnings />;
                    case 'worker-profile-page':
                        return <WorkerProfilePage />;
                    default:
                        return <SplashScreen />;
                }
            };

            return (
                <>
                    {renderScreen()}
                    <Modal />
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
